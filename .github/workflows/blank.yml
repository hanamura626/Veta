name: Test DNSHE Turnstile Bypass

on:
  workflow_dispatch: # Bisa dijalankan manual dari tab Actions

jobs:
  run-solver:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # Dipercepat jadi 5 menit karena maksimal nunggu cuma 60 detik

    steps:
      - name: 1. Checkout Repositori
        uses: actions/checkout@v4

      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Install Dependensi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Download Camoufox Browser
        run: |
          python -m camoufox fetch

      - name: 5. Jalankan Script (Xvfb)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" python solver.py

      - name: 6. Upload Hasil (Screenshot)
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: turnstile-result
          path: out/
          retention-days: 3
